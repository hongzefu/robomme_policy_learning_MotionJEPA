# 官方16×100 context 配置；motion 换成 Wan 零参数时间优先池化表，没有 encoder checkpoint。
budget: 512
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
integration_type: context
memory_token_dim: 2048
representation_type: perceptual
perceptual_memory:
  type: frame_sampling
motion:
  enabled: true
  source_shape: [1, 1024]
  readout: wan_raw_timepool8_spatial8x8_v1
  num_tokens: 1
  dim: 1024
  budget: 96
  pos_dim: 256
  demo_min_real_frames: 17
  demo_tail_pad: repeat_last
  stride: 32
  window_frames: 33
  window_direction: forward
  grid_origin: segment_start
  frame_size: 256
  store_path: v1-store/datasets/16task-orig100-1600ep-9e109419/motion-wan-timepool1024
  encoder_kind: wan_fixedpool1024
  online_gpu: 1
