# 64 帧 × 4×4（token_per_image 16 × 64 帧 = 1024 位）+ modulation 接入，无 motion 节（关闭态）。
# 相对 perceptual-framesamp-modul-32frame-4x4.yaml 只改 budget 512 → 1024（1127 计划 B 组）。
budget: 1024
num_views: 1
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: frame_sampling
