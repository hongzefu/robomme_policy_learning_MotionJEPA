# context 8×8 开启 motion（mixed8 库）：帧 512 与 motion 160 都进主干前缀；相对 modul 版只改接入方式与输出宽；派生方式同 0928 history-context-motion160.yaml（docs/root-archive/1019-mixed8-ctx512-motion-plan.md）
budget: 512
num_views: 1
token_per_image: 64
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
integration_type: context
