  demo_min_real_frames: 17
  demo_tail_pad: repeat_last
  stride: 16
  window_frames: 33
  window_direction: forward
  grid_origin: segment_start
  store_path: v1-store/datasets/16task-mixed8-200-3200ep-e3c7564f/motion
  source_run: wan-mixed8-200-filter2-stop075-b88x8-72ep-a/checkpoint_epoch_72.pt#encoder
  pos_dim: 256
  frame_size: 256
  online_gpu: 4             # 只供在线 sidecar 使用，训练不读取。
