# 仅供 o16gl-tier 测时（1031 计划 K9/R8）：由 perceptual-framesamp-ctx-32frame-4x4-motion-stage2-4x256-orig16.yaml 拷贝，删 motion 段，budget=256（16 帧×16）；契约拒绝其进入正式训练与评估。
budget: 256
num_views: 1
