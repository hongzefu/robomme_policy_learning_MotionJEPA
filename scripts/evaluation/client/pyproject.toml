[project]
name = "motionjepa-policy-eval-client"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "robomme", "openpi-client", "ninja==1.13.0", "deepspeed==0.18.3",
    "google-genai==1.56.0", "google-generativeai==0.8.6", "ms-swift==3.11.1",
    "qwen-vl-utils==0.0.14", "transformers==4.57.3", "moviepy==2.2.1",
    "setuptools==80.9.0", "torch==2.9.1", "torchvision==0.24.1",
    "mani-skill", "tyro", "loguru", "imageio[ffmpeg]", "pytest",
    # BinFill demo 前缀（0922-binfill-demo-prefix-plan.md）：预生成脚本与 DemoPrefixStore 直接
    # import h5py / cv2 存取前缀帧。两者本来就作为 mani-skill / robomme 的传递依赖在环境里，
    # 这里只是把「直接依赖」这件事显式声明出来；版本钉死在既有 lock 已解析到的那一个，解析图不变。
    "h5py==3.16.0", "opencv-python==4.11.0.86",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.uv.sources]
robomme = { path = "../../../third_party/robomme_benchmark", editable = true }
openpi-client = { path = "../../../packages/openpi-client", editable = true }
mani-skill = { git = "https://github.com/YinpeiDai/ManiSkill.git", rev = "07be6fbc66350ddca200abfb0a11b692f078f7fd" }
