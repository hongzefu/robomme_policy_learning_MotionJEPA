<svg xmlns="http://www.w3.org/2000/svg" width="680" height="880" viewBox="0 0 680 880" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>三条 mask 在 token 数轴上的取值与效果</title>
<desc>横轴为 1188 个 token，从左到右为记忆、运动、图像、文本、动作五段。上五行画 input_mask、ar_mask、块号、na_mask、记忆区，下四行画每一段 token 能读到的范围。段宽未按 token 数比例绘制。</desc>
<rect x="0" y="0" width="680" height="880" fill="#FFFFFF"/>
<g stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3">
<line x1="220" y1="80" x2="220" y2="825"/>
<line x1="300" y1="80" x2="300" y2="825"/>
<line x1="480" y1="80" x2="480" y2="825"/>
<line x1="570" y1="80" x2="570" y2="825"/>
</g>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
<rect x="40" y="36" width="180" height="30" rx="4"/>
<rect x="220" y="36" width="80" height="30" rx="4"/>
<rect x="300" y="36" width="180" height="30" rx="4"/>
<rect x="480" y="36" width="90" height="30" rx="4"/>
<rect x="570" y="36" width="70" height="30" rx="4"/>
</g>
<g font-size="14" font-weight="500" fill="#085041" text-anchor="middle">
<text x="130" y="56">记忆 512</text>
<text x="260" y="56">运动 80</text>
<text x="390" y="56">图像 512</text>
<text x="525" y="56">文本 64</text>
<text x="605" y="56">动作 20</text>
</g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="130" y="82">0–511</text>
<text x="260" y="82">512–591</text>
<text x="390" y="82">592–1103</text>
<text x="525" y="82">1104–1167</text>
<text x="605" y="82">1168–1187</text>
</g>

<text x="40" y="122" font-size="14" font-weight="500" fill="#2C2C2A">input_mask（按样本变）</text>
<g stroke-width="0.5">
<rect x="40" y="130" width="108" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="148" y="130" width="72" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
<rect x="220" y="130" width="12" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="232" y="130" width="68" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
<rect x="300" y="130" width="180" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="480" y="130" width="45" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="525" y="130" width="45" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
<rect x="570" y="130" width="70" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
</g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="130" y="168">static_mask：前 16k 位</text>
<text x="260" y="168">前 m 位</text>
<text x="390" y="168">image_masks：全部</text>
<text x="525" y="168">前 L 位</text>
<text x="605" y="168">全部</text>
</g>

<text x="40" y="202" font-size="14" font-weight="500" fill="#2C2C2A">ar_mask（固定，只有 2 个 True）</text>
<rect x="40" y="210" width="600" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<rect x="300" y="210" width="4" height="22" fill="#534AB7"/>
<rect x="570" y="210" width="4" height="22" fill="#534AB7"/>
<g font-size="12" fill="#5F5E5A">
<text x="40" y="248">其余 1186 位 False</text>
<text x="306" y="248">第 592 位 True</text>
<text x="640" y="248" text-anchor="end">第 1168 位 True</text>
</g>

<text x="40" y="282" font-size="14" font-weight="500" fill="#2C2C2A">cumsum(ar_mask) = 块号</text>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
<rect x="40" y="290" width="260" height="22" rx="2"/>
<rect x="300" y="290" width="270" height="22" rx="2"/>
<rect x="570" y="290" width="70" height="22" rx="2"/>
</g>
<g font-size="12" fill="#085041" text-anchor="middle">
<text x="170" y="306">块号 0</text>
<text x="435" y="306">块号 1</text>
<text x="605" y="306">块号 2</text>
</g>
<text x="40" y="328" font-size="12" fill="#5F5E5A">条件 A：q 可读 k 当且仅当 块号[k] ≤ 块号[q]</text>

<text x="40" y="362" font-size="14" font-weight="500" fill="#2C2C2A">na_mask（固定，512 个 True）</text>
<g stroke-width="0.5">
<rect x="40" y="370" width="260" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
<rect x="300" y="370" width="180" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="480" y="370" width="160" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
</g>
<text x="390" y="408" font-size="12" fill="#5F5E5A" text-anchor="middle">图像 512 位 True，其余全 False</text>

<text x="40" y="442" font-size="14" font-weight="500" fill="#2C2C2A">cumsum(na_mask) ≤ 0 的范围 = 记忆区</text>
<rect x="40" y="450" width="260" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="170" y="466" font-size="12" fill="#3C3489" text-anchor="middle">第 0–591 位</text>
<rect x="300" y="450" width="340" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="488" font-size="12" fill="#5F5E5A">条件 C：q 或 k 是图像，且 k 落在这一段，则删掉</text>

<text x="40" y="530" font-size="14" font-weight="500" fill="#2C2C2A">效果：q 在某段时能读到的 k（空位删除另按 input_mask 叠加）</text>

<text x="40" y="560" font-size="14" font-weight="500" fill="#2C2C2A">q = 记忆 或 运动</text>
<rect x="40" y="568" width="260" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="300" y="568" width="340" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="606" font-size="12" fill="#5F5E5A">条件 A 只放行块号 0</text>

<text x="40" y="640" font-size="14" font-weight="500" fill="#2C2C2A">q = 图像</text>
<rect x="40" y="648" width="260" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<rect x="300" y="648" width="270" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="570" y="648" width="70" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="686" font-size="12" fill="#5F5E5A">条件 A 放行块号 0 和 1，条件 C 再删掉第 0–591 位</text>

<text x="40" y="720" font-size="14" font-weight="500" fill="#2C2C2A">q = 文本</text>
<rect x="40" y="728" width="530" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="570" y="728" width="70" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="766" font-size="12" fill="#5F5E5A">条件 A 放行块号 0 和 1，条件 C 不触发</text>

<text x="40" y="800" font-size="14" font-weight="500" fill="#2C2C2A">q = 动作</text>
<rect x="40" y="808" width="600" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="40" y="846" font-size="12" fill="#5F5E5A">条件 A 放行全部块号，条件 C 不触发</text>

<rect x="40" y="860" width="14" height="14" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="872" font-size="12" fill="#5F5E5A">True / 可读</text>
<rect x="150" y="860" width="14" height="14" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="170" y="872" font-size="12" fill="#5F5E5A">False / 不可读</text>
<text x="640" y="872" font-size="12" fill="#5F5E5A" text-anchor="end">段宽未按 token 数比例绘制</text>
</svg>
