<?xml version="1.0" encoding="UTF-8"?>
<!-- motion 窗口取法与补帧示意。比例尺：1 帧 = 4px，x(t) = 60 + 4·t；所有窗口条的 x 均由帧号算出。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="776" viewBox="0 0 1100 776" font-family="sans-serif" font-size="14">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#dbeafe"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#2563eb" stroke-width="2"/>
    </pattern>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="1100" height="776" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="60" y="28" font-size="16" font-weight="bold" fill="#111827">motion 窗口怎么取、怎么补帧（例：一个 episode 共 192 帧，es = 96，当前步 s = 150）</text>

  <!-- 时间轴：段底带 -->
  <rect x="60" y="62" width="384" height="26" fill="#dbeafe"/>
  <rect x="444" y="62" width="384" height="26" fill="#dcfce7"/>
  <text x="68" y="80" fill="#1e3a8a">demo 段（t = 0…95）</text>
  <text x="452" y="80" fill="#14532d">exec 段（t = 96…191）</text>

  <!-- 轴线与刻度：细刻度每 8 帧一格 -->
  <line x1="60" y1="94" x2="828" y2="94" stroke="#374151" stroke-width="1.5"/>
  <g stroke="#9ca3af" stroke-width="1">
    <line x1="60" y1="94" x2="60" y2="99"/><line x1="92" y1="94" x2="92" y2="99"/><line x1="124" y1="94" x2="124" y2="99"/><line x1="156" y1="94" x2="156" y2="99"/>
    <line x1="188" y1="94" x2="188" y2="99"/><line x1="220" y1="94" x2="220" y2="99"/><line x1="252" y1="94" x2="252" y2="99"/><line x1="284" y1="94" x2="284" y2="99"/>
    <line x1="316" y1="94" x2="316" y2="99"/><line x1="348" y1="94" x2="348" y2="99"/><line x1="380" y1="94" x2="380" y2="99"/><line x1="412" y1="94" x2="412" y2="99"/>
    <line x1="444" y1="94" x2="444" y2="99"/><line x1="476" y1="94" x2="476" y2="99"/><line x1="508" y1="94" x2="508" y2="99"/><line x1="540" y1="94" x2="540" y2="99"/>
    <line x1="572" y1="94" x2="572" y2="99"/><line x1="604" y1="94" x2="604" y2="99"/><line x1="636" y1="94" x2="636" y2="99"/><line x1="668" y1="94" x2="668" y2="99"/>
    <line x1="700" y1="94" x2="700" y2="99"/><line x1="732" y1="94" x2="732" y2="99"/><line x1="764" y1="94" x2="764" y2="99"/><line x1="796" y1="94" x2="796" y2="99"/>
    <line x1="828" y1="94" x2="828" y2="99"/>
  </g>
  <!-- 主刻度 -->
  <g stroke="#374151" stroke-width="1.5">
    <line x1="60" y1="94" x2="60" y2="103"/><line x1="188" y1="94" x2="188" y2="103"/><line x1="316" y1="94" x2="316" y2="103"/>
    <line x1="444" y1="94" x2="444" y2="103"/><line x1="572" y1="94" x2="572" y2="103"/><line x1="700" y1="94" x2="700" y2="103"/><line x1="824" y1="94" x2="824" y2="103"/>
  </g>
  <g font-size="13" fill="#374151" text-anchor="middle">
    <text x="60" y="116">0</text><text x="188" y="116">32</text><text x="316" y="116">64</text>
    <text x="444" y="116">96</text><text x="572" y="116">128</text><text x="700" y="116">160</text><text x="826" y="116">191</text>
    <text x="444" y="132" fill="#14532d">es = 96，exec 起点</text>
  </g>

  <!-- 当前步 s = 150：x = 60 + 4·150 = 660 -->
  <text x="660" y="50" text-anchor="middle" fill="#b91c1c" font-weight="bold">当前步 s = 150</text>
  <line x1="660" y1="56" x2="660" y2="562" stroke="#dc2626" stroke-width="2"/>

  <!-- 窗口条区标题 -->
  <text x="60" y="152" fill="#111827" font-weight="bold">窗口条（每条 = 起点起连续 33 帧，起点钉在段内网格 0, 32, 64…）</text>
  <text x="850" y="152" fill="#111827" font-weight="bold">各窗口说明</text>

  <!-- R1 demo 起点 0：t = 0…32 → x 60…192 -->
  <rect x="60" y="168" width="132" height="20" fill="#2563eb"/>
  <text x="850" y="182" fill="#1e3a8a">demo 起点 0</text>
  <text x="850" y="199" fill="#374151">真实 33 帧（t = 0…32）</text>

  <!-- R2 demo 起点 32：t = 32…64 → x 188…320 -->
  <rect x="188" y="222" width="132" height="20" fill="#2563eb"/>
  <text x="850" y="236" fill="#1e3a8a">demo 起点 32</text>
  <text x="850" y="253" fill="#374151">真实 33 帧（t = 32…64）</text>

  <!-- R3 demo 起点 64：真实 t = 64…95 → x 316…444；第 33 格补帧 → x 444…448 -->
  <rect x="316" y="276" width="128" height="20" fill="#2563eb"/>
  <rect x="444" y="276" width="4" height="20" fill="url(#hatch)" stroke="#2563eb" stroke-width="1"/>
  <path d="M472,286 H451" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="478" y="291" font-size="13" fill="#1d4ed8">尾格为补帧（见右侧放大）</text>
  <text x="850" y="290" fill="#1e3a8a">demo 起点 64</text>
  <text x="850" y="307" fill="#374151">真实 32 帧（t = 64…95）+ 补 1</text>
  <!-- 局部放大：窗口尾部 t = 92…95 四格 + 补格 -->
  <text x="850" y="328" font-size="13" fill="#6b7280">局部放大：窗口尾部 4 格 + 补 1 格</text>
  <g font-size="12" fill="#ffffff" text-anchor="middle">
    <rect x="850" y="336" width="26" height="24" fill="#2563eb" stroke="#ffffff"/>
    <rect x="876" y="336" width="26" height="24" fill="#2563eb" stroke="#ffffff"/>
    <rect x="902" y="336" width="26" height="24" fill="#2563eb" stroke="#ffffff"/>
    <rect x="928" y="336" width="26" height="24" fill="#2563eb" stroke="#ffffff"/>
    <rect x="954" y="336" width="26" height="24" fill="url(#hatch)" stroke="#2563eb"/>
    <text x="863" y="352">92</text><text x="889" y="352">93</text><text x="915" y="352">94</text><text x="941" y="352">95</text>
    <text x="967" y="352" fill="#1e3a8a">补</text>
  </g>
  <!-- 小箭头：从 t=95 格指到补格（正交走线，走格子下方） -->
  <path d="M941,362 V372 H967 V363" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="850" y="392" font-size="13" fill="#374151">补格重复 demo 最后一帧 t = 95</text>

  <!-- R4 exec 起点 96：t = 96…128 → x 444…576，完整 → 可见 -->
  <rect x="444" y="412" width="132" height="20" fill="#16a34a"/>
  <text x="584" y="427" fill="#15803d" font-weight="bold">可见</text>
  <text x="850" y="426" fill="#14532d">exec 起点 96</text>
  <text x="850" y="443" fill="#374151">真实 33 帧（96…128）→ 可见</text>

  <!-- R5 exec 起点 128：t = 128…160 → x 572…704，尾端 160 > s=150 → 不可见 -->
  <rect x="572" y="466" width="132" height="20" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="712" y="481" fill="#15803d">不可见</text>
  <text x="850" y="480" fill="#14532d">exec 起点 128</text>
  <text x="850" y="497" fill="#374151">需到 t = 160，当前 s = 150</text>
  <text x="850" y="514" font-size="13" fill="#374151">→ 还没凑齐 33 帧，不可见，等后面的帧</text>

  <!-- R6 exec 起点 160：t = 160…192 → x 700…832，起点未到 -->
  <rect x="700" y="528" width="132" height="20" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="766" y="543" font-size="13" fill="#6b7280" text-anchor="middle">起点未到</text>
  <text x="850" y="542" fill="#4b5563">exec 起点 160</text>
  <text x="850" y="559" fill="#374151">起点未到（s = 150 &lt; 160）</text>

  <!-- 图例 -->
  <g font-size="14" fill="#374151">
    <rect x="60" y="584" width="24" height="16" fill="#2563eb"/><text x="92" y="597">demo 真实帧</text>
    <rect x="230" y="584" width="24" height="16" fill="url(#hatch)" stroke="#2563eb"/><text x="262" y="597">补帧（重复 t = es−1）</text>
    <rect x="480" y="584" width="24" height="16" fill="#16a34a"/><text x="512" y="597">exec 可见窗口</text>
    <rect x="640" y="584" width="24" height="16" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/><text x="672" y="597">尚不可见（未凑齐 33 帧）</text>
    <rect x="880" y="584" width="24" height="16" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5,3"/><text x="912" y="597">起点未到</text>
  </g>

  <!-- 规则框 -->
  <rect x="60" y="620" width="1030" height="136" fill="#f9fafb" stroke="#d1d5db" rx="4"/>
  <text x="76" y="642" font-weight="bold" fill="#111827">规则</text>
  <g fill="#374151">
    <text x="76" y="666">1. 窗口 = 起点往后连续 33 帧；起点钉在段内绝对网格 0, 32, 64, …；demo 与 exec 各自从段起点起算，窗口不跨段。</text>
    <text x="76" y="690">2. demo 段：至少 17 个真实帧才算一个窗口；不足 33 帧时重复 demo 最后一帧（es−1）补齐；绝不借 exec 的帧。</text>
    <text x="76" y="714">3. exec 段：永不补帧，必须凑齐 33 个真实帧才可见。</text>
    <text x="76" y="738">4. 可见窗口数随当前步 s 增长，每过 32 帧多一个；训练建库与在线现算用同一条规则。</text>
  </g>
</svg>
