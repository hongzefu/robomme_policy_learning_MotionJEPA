<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1800" width="1600" height="1800" role="img" aria-labelledby="title desc">
<title id="title">动作网络与记忆调制：从上到下的输入输出尺寸总图</title>
<desc id="desc">单列主干依次为动作嵌入、归一化、注意力、残差相加、记忆调制、归一化、前馈网络、残差相加和层输出。动作输入20×32，主干特征20×1024，前馈网络中间20×4096；动作层重复18次后输出头得到20×32速度场。右侧896×1024历史记忆与第一次残差后的20×1024动作一起进入交叉注意力，读出20×1024，生成两组20×1024的缩放和偏移，回到主干记忆调制。左侧两条旁路分别保留动作嵌入后的原特征和第一次残差相加后的特征，供两处残差相加使用。绿色为新增记忆模块。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#374151"/></marker></defs>
<g font-family="'Noto Sans CJK SC','Source Han Sans SC','PingFang SC','Microsoft YaHei','Droid Sans Fallback',sans-serif">
<rect width="1600" height="1800" fill="#ffffff"/>
<text x="800" y="40" font-size="30" font-weight="700" fill="#111827" text-anchor="middle">动作网络如何接入历史记忆</text>
<text x="800" y="76" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">省略批次维；20 为动作序列长度，P 为图像 / 语言 token 数。</text>
<g id="action-embedding">
<rect x="440" y="100" width="520" height="110" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="card"/>
<text x="700.0" y="126" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">动作输入 20×32</text>
<text x="700.0" y="158" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">动作嵌入</text>
<text x="700.0" y="196" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<g id="repeated-action-layer">
<rect x="390" y="250" width="620" height="1310" rx="9" fill="#fff" stroke="#9CA3AF" stroke-width="1.7" class="panel" stroke-dasharray="8,7"/>
<g id="first-normalization">
<rect x="440" y="280" width="520" height="110" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="card"/>
<text x="700.0" y="306" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">输入 20×1024；时间条件 1024</text>
<text x="700.0" y="338" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">归一化</text>
<text x="700.0" y="374" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<g id="original-attention">
<rect x="440" y="430" width="520" height="110" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="card"/>
<text x="700.0" y="456" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">动作 20×1024 ＋ 当前图像 / 语言</text>
<text x="700.0" y="488" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">注意力</text>
<text x="700.0" y="524" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<g id="first-residual">
<rect x="440" y="580" width="520" height="110" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="card"/>
<text x="700.0" y="606" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">两路特征，各 20×1024</text>
<text x="700.0" y="638" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">残差相加</text>
<text x="700.0" y="674" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<g id="memory-modulation">
<rect x="440" y="780" width="520" height="110" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.7" class="card"/>
<text x="700.0" y="806" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">动作 20×1024 ＋ 两组调制量</text>
<text x="700.0" y="838" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">记忆调制</text>
<text x="700.0" y="874" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<g id="second-normalization">
<rect x="440" y="930" width="520" height="110" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="card"/>
<text x="700.0" y="956" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">输入 20×1024；时间条件 1024</text>
<text x="700.0" y="988" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">归一化</text>
<text x="700.0" y="1024" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<g id="feedforward">
<rect x="440" y="1080" width="520" height="130" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="card"/>
<text x="700" y="1107" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">输入 20×1024</text>
<text x="700" y="1139" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">前馈网络</text>
<text x="700" y="1169" font-size="21" font-weight="400" fill="#111827" text-anchor="middle">中间 20×4096</text>
<text x="700" y="1199" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<g id="second-residual">
<rect x="440" y="1300" width="520" height="110" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="card"/>
<text x="700.0" y="1326" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">两路特征，各 20×1024</text>
<text x="700.0" y="1358" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">残差相加</text>
<text x="700.0" y="1394" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<g id="layer-output">
<rect x="440" y="1450" width="520" height="80" rx="9" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.7" class="card"/>
<text x="700" y="1482" font-size="25" font-weight="700" fill="#111827" text-anchor="middle">该层输出</text>
<text x="700" y="1512" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">20×1024</text>
</g>
<path d="M700,390 V430" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,540 V580" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,690 V780" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,890 V930" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,1040 V1080" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,1210 V1300" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M700,1410 V1450" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<text x="410" y="1549" font-size="20" font-weight="700" fill="#6B7280" text-anchor="start">本层与记忆分支重复 18 次</text>
</g>
<path d="M700,210 V280" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<g id="residual-bypasses">
<path d="M700,245 H285 V630 H440" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<text x="160" y="417" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">保留原特征</text>
<text x="160" y="448" font-size="21" font-weight="400" fill="#111827" text-anchor="middle">20×1024</text>
<path d="M700,730 H340 V1350 H440" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<text x="180" y="1005" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">保留第一次</text>
<text x="180" y="1037" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">相加后的特征</text>
<text x="180" y="1069" font-size="21" font-weight="400" fill="#111827" text-anchor="middle">20×1024</text>
<circle cx="700" cy="245" r="4.5" fill="#374151"/>
<circle cx="700" cy="730" r="4.5" fill="#374151"/>
</g>
<g id="current-image-language">
<rect x="1100" y="250" width="430" height="100" rx="9" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.7" class="card"/>
<text x="1315" y="287" font-size="25" font-weight="700" fill="#111827" text-anchor="middle">当前图像 / 语言</text>
<text x="1315" y="323" font-size="23" font-weight="700" fill="#111827" text-anchor="middle">P×2048</text>
</g>
<path d="M1100,300 H1040 V480 H960" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<g id="history-memory">
<rect x="1100" y="400" width="430" height="120" rx="9" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.7" class="card"/>
<text x="1315" y="435" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">历史记忆</text>
<text x="1315" y="472" font-size="24" font-weight="700" fill="#111827" text-anchor="middle">896×1024</text>
<text x="1315" y="504" font-size="20" font-weight="400" fill="#111827" text-anchor="middle">512 图像 + 384 运动</text>
</g>
<g id="memory-cross-attention">
<rect x="1100" y="580" width="430" height="110" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.7" class="card"/>
<text x="1315.0" y="606" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">20×1024 ＋ 896×1024</text>
<text x="1315.0" y="638" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">交叉注意力</text>
<text x="1315.0" y="674" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出 20×1024</text>
</g>
<path d="M1315,520 V580" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M960,630 H1100" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1030" y="615" font-size="18" font-weight="400" fill="#111827" text-anchor="middle">20×1024</text>
<g id="memory-readout">
<rect x="1100" y="710" width="430" height="45" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.7" class="card"/>
<text x="1315" y="740" font-size="23" font-weight="700" fill="#111827" text-anchor="middle">记忆读出 20×1024</text>
</g>
<path d="M1315,690 V710" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<g id="memory-scale-shift">
<rect x="1100" y="780" width="430" height="110" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.7" class="card"/>
<text x="1315.0" y="806" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">输入 20×1024</text>
<text x="1315.0" y="838" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">生成缩放 / 偏移</text>
<text x="1315.0" y="874" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">输出两组 20×1024</text>
</g>
<path d="M1315,755 V780" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1100,830 H960" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1030" y="815" font-size="20" font-weight="400" fill="#111827" text-anchor="middle">两组</text>
<g id="legend">
<rect x="1110" y="1000" width="24" height="24" rx="9" fill="#ECFDF5" stroke="#10B981" stroke-width="1.7" class="swatch"/>
<text x="1150" y="1020" font-size="22" font-weight="400" fill="#111827" text-anchor="start">新增记忆模块</text>
<rect x="1110" y="1050" width="24" height="24" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="swatch"/>
<text x="1150" y="1070" font-size="22" font-weight="400" fill="#111827" text-anchor="start">原有动作网络</text>
</g>
<path d="M700,1530 V1600" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
<g id="output-head">
<rect x="440" y="1600" width="520" height="110" rx="9" fill="#fff" stroke="#374151" stroke-width="1.7" class="card"/>
<text x="700.0" y="1626" font-size="20" font-weight="400" fill="#6B7280" text-anchor="middle">输入 20×1024</text>
<text x="700.0" y="1658" font-size="26" font-weight="700" fill="#111827" text-anchor="middle">输出头</text>
<text x="700.0" y="1696" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">速度场 20×32</text>
</g>
<text x="800" y="1762" font-size="21" font-weight="400" fill="#6B7280" text-anchor="middle">绿色是新增部分；不使用历史记忆时，跳过记忆调制。</text>
</g></svg>
