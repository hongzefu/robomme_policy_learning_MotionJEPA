<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1190" viewBox="0 0 680 1190" role="img" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>三条 mask 在 token 数轴上的取值与效果（交错拼接）</title>
<desc>横轴为 1204 个 token，从左到右为记忆区、图像、文本、动作四段；记忆区 608 位由帧路 512 个 token 与运动路 96 个 token 按时刻交错而成，位置随样本变。上五行画 input_mask、ar_mask、块号、na_mask、记忆区，并逐行注明接入 motion memory 后各自改了什么，记忆区一行附条件 C 的设计目的；中间一行标出 make_attn_mask 的转换；下四行是该函数输出矩阵按 q 所在段分组的行。段宽未按 token 数比例绘制。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="1190" fill="#FFFFFF"/>
<rect x="40" y="90" width="260" height="1004" fill="#FAEEDA" fill-opacity="0.45"/>
<g stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3">
<line x1="300" y1="80" x2="300" y2="1094"/>
<line x1="480" y1="80" x2="480" y2="1094"/>
<line x1="570" y1="80" x2="570" y2="1094"/>
</g>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
<rect x="40" y="36" width="260" height="30" rx="4"/>
<rect x="300" y="36" width="180" height="30" rx="4"/>
<rect x="480" y="36" width="90" height="30" rx="4"/>
<rect x="570" y="36" width="70" height="30" rx="4"/>
</g>
<g font-size="14" font-weight="500" fill="#085041" text-anchor="middle">
<text x="170" y="56">记忆区 608 = 帧 512 ⊕ 运动 96（交错）</text>
<text x="390" y="56">图像 512</text>
<text x="525" y="56">文本 64</text>
<text x="605" y="56">动作 20</text>
</g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="170" y="82">0–607</text>
<text x="390" y="82">608–1119</text>
<text x="525" y="82">1120–1183</text>
<text x="605" y="82">1184–1203</text>
</g>

<text x="40" y="122" font-size="14" font-weight="500" fill="#2C2C2A">input_mask（按样本变）</text>
<g stroke-width="0.5">
<rect x="40" y="130" width="190" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="230" y="130" width="70" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
<rect x="300" y="130" width="180" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="480" y="130" width="45" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="525" y="130" width="45" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
<rect x="570" y="130" width="70" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
</g>
<g fill="#BA7517">
<rect x="58" y="130" width="3" height="22"/>
<rect x="92" y="130" width="3" height="22"/>
<rect x="126" y="130" width="3" height="22"/>
<rect x="160" y="130" width="3" height="22"/>
<rect x="194" y="130" width="3" height="22"/>
</g>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="135" y="168">前 16k + m 位 True（k 有效帧、m 真 motion）</text>
<text x="265" y="168">其余 False</text>
<text x="390" y="168">image_masks：全部</text>
<text x="525" y="168">前 L 位</text>
<text x="605" y="168">全部</text>
</g>
<text x="40" y="184" font-size="12" fill="#5F5E5A">接入 motion memory 后：[static_mask ⊕ motion_mask] 608 位经 mem_order 按时刻重排，True 集合不变、真 token 全部前移、</text>
<text x="40" y="200" font-size="12" fill="#5F5E5A">两路 padding 合并落尾；橙色竖条 = motion token 按起点时刻插在帧 token 之间（位置随样本变）</text>

<text x="40" y="232" font-size="14" font-weight="500" fill="#2C2C2A">ar_mask（固定，只有 2 个 True）</text>
<rect x="40" y="240" width="600" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<rect x="300" y="240" width="4" height="22" fill="#534AB7"/>
<rect x="570" y="240" width="4" height="22" fill="#534AB7"/>
<g font-size="12" fill="#5F5E5A">
<text x="40" y="278">其余 1202 位 False</text>
<text x="306" y="278">第 608 位 True</text>
<text x="640" y="278" text-anchor="end">第 1184 位 True</text>
<text x="40" y="294">接入 motion memory 后：追加 96 个 False，两个 True 从第 512、1088 位</text>
<text x="40" y="310">后移到第 608、1184 位，仍是图像段与动作段的第一个 token；记忆区内不重排（整段 False）</text>
</g>

<text x="40" y="342" font-size="14" font-weight="500" fill="#2C2C2A">cumsum(ar_mask) = 块号</text>
<g fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5">
<rect x="40" y="350" width="260" height="22" rx="2"/>
<rect x="300" y="350" width="270" height="22" rx="2"/>
<rect x="570" y="350" width="70" height="22" rx="2"/>
</g>
<g font-size="12" fill="#085041" text-anchor="middle">
<text x="170" y="366">块号 0</text>
<text x="435" y="366">块号 1</text>
<text x="605" y="366">块号 2</text>
</g>
<text x="40" y="388" font-size="12" fill="#5F5E5A">条件 A：q 可读 k 当且仅当 块号[k] ≤ 块号[q]；帧 token 与 motion token 同属块号 0，交错不改块号</text>

<text x="40" y="420" font-size="14" font-weight="500" fill="#2C2C2A">na_mask（固定，512 个 True）</text>
<g stroke-width="0.5">
<rect x="40" y="428" width="260" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
<rect x="300" y="428" width="180" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7"/>
<rect x="480" y="428" width="160" height="22" rx="2" fill="#F1EFE8" stroke="#888780"/>
</g>
<text x="390" y="466" font-size="12" fill="#5F5E5A" text-anchor="middle">图像 512 位 True，其余全 False</text>
<text x="40" y="482" font-size="12" fill="#5F5E5A">接入 motion memory 后：追加 96 个 False；第一个 True 从第 512 位后移到第 608 位</text>

<text x="40" y="514" font-size="14" font-weight="500" fill="#2C2C2A">cumsum(na_mask) ≤ 0 的范围 = 记忆区</text>
<rect x="40" y="522" width="260" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="170" y="538" font-size="12" fill="#3C3489" text-anchor="middle">第 0–607 位</text>
<rect x="300" y="522" width="340" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="560" font-size="12" fill="#5F5E5A">条件 C：q 或 k 是图像，且 k 落在这一段，则删掉</text>
<text x="40" y="576" font-size="12" fill="#5F5E5A">接入 motion memory 后：记忆区从第 0–511 位扩到第 0–607 位，motion token 交错在帧 token 之间、整段落在记忆区内</text>
<text x="40" y="592" font-size="12" fill="#5F5E5A">条件 C 的目的：保护预训练 VLM 的视觉-语言对齐，因此运动 token 放在图像之前、落进记忆区；</text>
<text x="40" y="608" font-size="12" fill="#5F5E5A">放在图像之后则与所有 token 双向可见，本计划不采用（只保留交错一种布局）</text>

<line x1="340" y1="624" x2="340" y2="652" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="340" y="672" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle">make_attn_mask(input_mask, ar_mask, na_mask) → attn_mask (b, 1204, 1204)</text>
<text x="340" y="690" font-size="12" fill="#5F5E5A" text-anchor="middle">函数本身零改动；下四行是这个输出矩阵的行，按 q 所在段分组</text>
<text x="340" y="706" font-size="12" fill="#5F5E5A" text-anchor="middle">空位删除另按 input_mask 叠加，图中未画</text>

<text x="40" y="738" font-size="14" font-weight="500" fill="#2C2C2A">效果 = make_attn_mask 的输出：q 在某段时能读到的 k</text>

<text x="40" y="768" font-size="14" font-weight="500" fill="#2C2C2A">q = 记忆区（帧 token 或 motion token）</text>
<rect x="40" y="776" width="260" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="300" y="776" width="340" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="814" font-size="12" fill="#5F5E5A">条件 A 只放行块号 0：帧 token 与 motion token 互相可见，看不到图像、文本、动作</text>

<text x="40" y="848" font-size="14" font-weight="500" fill="#2C2C2A">q = 图像</text>
<rect x="40" y="856" width="260" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<rect x="300" y="856" width="270" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="570" y="856" width="70" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="894" font-size="12" fill="#5F5E5A">条件 A 放行块号 0 和 1，条件 C 再删掉第 0–607 位</text>

<text x="40" y="928" font-size="14" font-weight="500" fill="#2C2C2A">q = 文本</text>
<rect x="40" y="936" width="530" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="570" y="936" width="70" height="22" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="40" y="974" font-size="12" fill="#5F5E5A">条件 A 放行块号 0 和 1，条件 C 不触发</text>

<text x="40" y="1008" font-size="14" font-weight="500" fill="#2C2C2A">q = 动作</text>
<rect x="40" y="1016" width="600" height="22" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="40" y="1054" font-size="12" fill="#5F5E5A">条件 A 放行全部块号，条件 C 不触发</text>

<text x="40" y="1080" font-size="12" fill="#2C2C2A">三条向量的变长与 mem_order 重排都发生在 embed_memory 的返回值里；交错只改记忆区内 608 位的次序与位置号，</text>
<text x="40" y="1096" font-size="12" fill="#2C2C2A">三条 mask 的 True 集合、块号、记忆区范围、make_attn_mask、gemma 各层、loss、推理循环没有任何改动</text>

<rect x="40" y="1126" width="14" height="14" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="1138" font-size="12" fill="#5F5E5A">True / 可读</text>
<rect x="150" y="1126" width="14" height="14" rx="2" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="170" y="1138" font-size="12" fill="#5F5E5A">False / 不可读</text>
<rect x="280" y="1126" width="14" height="14" rx="2" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="300" y="1138" font-size="12" fill="#5F5E5A">接入 motion memory 后扩到 608 位的记忆区（含 96 个运动位，交错散布）</text>
<text x="640" y="1170" font-size="12" fill="#5F5E5A" text-anchor="end">段宽未按 token 数比例绘制</text>
</svg>
